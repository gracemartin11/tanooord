name: Secure RDP Runner

on:
  workflow_dispatch:
    inputs:
      num_jobs:
        description: "How many RDP jobs do you want to run? (1-5)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Create matrix
        id: set-matrix
        run: |
          N=${{ github.event.inputs.num_jobs }}
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range(1, $N + 1))))")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Will start $N RDP job(s): $MATRIX"

  secure-rdp:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: Create RDP User
        run: |
          $Password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP"
          }
          New-LocalUser -Name "RDP" -Password $Password -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Install Tailscale
        run: |
          Write-Host "=== Installing Tailscale ==="
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.84.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Start Tailscale
        run: |
          Write-Host "=== Starting Tailscale ==="
          $hostname = "gh-runner-rdp-${{ github.run_id }}-${{ matrix.job }}"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$hostname
          Start-Sleep -Seconds 10
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          echo "HOSTNAME=$hostname" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "Hostname: $hostname"

      - name: Verify RDP Port
        run: |
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if ($test.TcpTestSucceeded) {
            Write-Host "RDP Port is open ✅"
          } else {
            Write-Error "RDP Port test failed"
          }

      - name: Show Connection Details
        run: |
          Write-Host "════════════════════════════════════════════════════"
          Write-Host "✅  RDP INSTANCE ${{ matrix.job }} IS READY"
          Write-Host "════════════════════════════════════════════════════"
          Write-Host "IP Address  : $($env:TAILSCALE_IP)"
          Write-Host "Hostname    : $($env:HOSTNAME)"
          Write-Host "Username    : RDP"
          Write-Host "Password    : (from secret RDP_PASSWORD)"
          Write-Host "════════════════════════════════════════════════════"

      - name: Keep Runner Alive
        run: |
          $counter = 0
          while ($true) {
            $counter++
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Heartbeat #$counter – still alive (job ${{ matrix.job }})"
            Start-Sleep -Seconds 300
          }
